{
  "schema_version": "1.0",
  "harness_version": "0.5.0",
  "template_mode": false,
  "project": {
    "name": "Agentic Application Assessor",
    "summary": "A read-only, local-first Python CLI that compiles versioned evidence from an exact application repository, user-reviewed context, and supported analysis artifacts into deterministic JSON and Markdown assessments of purpose, architecture, interfaces, data movement, quality risks, contradictions, and unknowns.",
    "lifecycle": "new",
    "profile": "python-data",
    "status": "active",
    "repository": "stauntonjr/agentic-application-assessor"
  },
  "intent": {
    "users": [
      "engineering leads onboarding to unfamiliar applications",
      "maintainers of agent-developed applications"
    ],
    "outcomes": [
      "An evidence-backed map of application purpose, structure, interfaces, data movement, and important workflows",
      "Explicit contradictions, coverage gaps, quality risks, and investigation priorities without false completeness",
      "A safe handoff from repository-readiness evidence to application-level assessment"
    ],
    "success_metrics": [
      "Repeated assessment of unchanged inputs produces byte-identical canonical JSON and deterministic Markdown",
      "Every claim records an exact source, origin class, target identity, and derivation status or is explicitly unavailable",
      "Assessment changes no target file, Git metadata, network state, or external service",
      "Dogfood Agentic Repo Auditor first and Macro Technical Pulse second, producing at least one human-accepted follow-up decision",
      "make smoke passes locally and in CI"
    ],
    "in_scope": [
      "Exact local Git target identity and bounded static repository evidence",
      "User-reviewed application context and quality scenarios",
      "Agentic Repo Auditor 0.1.0 schema-1.2 JSON import through a fail-closed adapter",
      "Versioned canonical evidence graph and deterministic Markdown assessment",
      "Evidence-labeled system-context and container-level architecture proposals",
      "Contradictions, coverage limits, unknowns, and prioritized follow-up questions"
    ],
    "out_of_scope": [
      "Target code execution, dependency installation, builds, tests, or instrumentation in v0.1",
      "Network access, credentials, authenticated provider evidence, or live production telemetry in v0.1",
      "Model calls or model-scored findings in the deterministic v0.1 core",
      "Automatic remediation, compliance certification, security approval, or release-readiness claims",
      "Organization-wide aggregation"
    ]
  },
  "constraints": {
    "security": [
      "No secrets in the repository",
      "No target writes or target-code execution in the v0.1 core",
      "Reject symlink escapes and hostile repository-controlled Git helpers",
      "Validate imported schemas, tool identity, artifact digests, and exact target state",
      "Treat source, context, and reports as potentially confidential"
    ],
    "data_classification": "potentially confidential source, architecture, domain context, runtime topology, and generated reports; local-only processing by default",
    "deployment": "local CLI; CI verification may be added within the read-only boundary; no hosted service or production deployment authorized",
    "budget": "v0.1 must require no paid external service and no external model spend",
    "licenses": [
      "MIT"
    ]
  },
  "engineering": {
    "languages": [
      "Python"
    ],
    "build_commands": [
      "uv build"
    ],
    "test_commands": [
      "uv run pytest"
    ],
    "command_contract": {
      "primary_check": "make smoke",
      "bootstrap": "uv sync --locked",
      "format_check": "uvx --from ruff==0.12.10 ruff format --check .",
      "lint": "uvx --from ruff==0.12.10 ruff check .",
      "typecheck": "uvx --from pyright==1.1.403 pyright",
      "unit": "uv run --with pytest==8.4.1 --with pytest-cov==6.2.1 --with hypothesis==6.138.13 python -m pytest --cov=agentic_application_assessor --cov-branch --cov-report=term-missing -m 'not integration'",
      "integration": "uv run --with pytest==8.4.1 python -m pytest -m integration",
      "package_smoke": "python3 scripts/package_smoke.py"
    },
    "quality": {
      "dependency_lock": "uv.lock",
      "coverage_policy": "branch-coverage-baseline-required-before-release",
      "required_checks": [
        "format_check",
        "lint",
        "typecheck",
        "unit",
        "integration",
        "package_smoke"
      ],
      "property_testing": "hypothesis"
    },
    "versioning": {
      "strategy": "semver",
      "current": "0.1.0",
      "public_contract": [
        "CLI arguments and exit statuses",
        "application-context schema",
        "canonical assessment-report schema",
        "stable evidence and claim identifiers"
      ],
      "source": "pyproject.toml:project.version",
      "tag_prefix": "v",
      "pre_1_0_policy": "breaking-changes-bump-minor",
      "release_notes": "CHANGELOG.md"
    },
    "architecture_changes_require_adr": true,
    "public_interface_acceptance_required": true
  },
  "autonomy": {
    "level": "supervised",
    "network_writes": "explicit-human-approval",
    "destructive_actions": "explicit-human-approval",
    "release": "human-only",
    "policy_changes": "human-review"
  },
  "sources_of_truth": [
    {
      "rank": 1,
      "source": "accepted ADRs",
      "scope": "durable architecture decisions"
    },
    {
      "rank": 2,
      "source": "code and schemas",
      "scope": "implemented behavior"
    },
    {
      "rank": 3,
      "source": "tests and check evidence",
      "scope": "verified behavior"
    },
    {
      "rank": 4,
      "source": "GitHub Issues",
      "scope": "accepted work and acceptance criteria"
    },
    {
      "rank": 5,
      "source": "GitHub Project",
      "scope": "operational planning view"
    },
    {
      "rank": 6,
      "source": "handoff and reports",
      "scope": "orientation and derived status"
    }
  ],
  "github": {
    "issues_are_canonical_work_items": true,
    "project_enabled": true,
    "planning_contract": ".github/planning.json",
    "security": {
      "dependency_updates": "dependabot",
      "dependency_review": "required",
      "code_scanning": "codeql",
      "secret_scanning": "required",
      "push_protection": "required",
      "workflow_permissions": "least-privilege",
      "action_pinning": "full-commit-sha"
    }
  },
  "open_questions": [],
  "decisions": []
}
